# set prefix to C-space
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space

bind -n M-h selectp -L
bind -n M-l selectp -R
bind -n M-j selectp -D
bind -n M-k selectp -U

bind -n M-H swap-pane -s '{left-of}'
bind -n M-L swap-pane -s '{right-of}'
bind -n M-J swap-pane -s '{down-of}'
bind -n M-K swap-pane -s '{up-of}'
bind -n M-Enter resize-pane -Z

bind -n M-= resize-pane -R 5
bind -n M-- resize-pane -L 5
bind -n M-+ resize-pane -U 5
bind -n M-_ resize-pane -D 5

bind -n M-r source-file "~/.config/tmux/tmux.conf"

set -g editor "nvim"
set -g base-index 1
set -g renumber-windows on

set -g status-justify absolute-centre
set -g status-keys vi
set -g mode-keys vi
set -g status-position top
set -g status-left '  #[fg=#b16286,bold]#S#[default]'
set -g status-left-length 20
set -g status-right ""

set -g pane-border-lines double
set -a terminal-features "tmux-256color:RGB"
set -g status-style "fg=white bg=default"
set -g window-status-format "F#I: #{?window_zoomed_flag,ZOOMED,#W}"
set -g window-status-current-format "F#I: #{?window_zoomed_flag,ZOOMED,#W}"
set -g window-status-current-style "fg=green bold"

bind -n M-f run "tmux neww $HOME/.config/scripts/sessionizer.sh"

bind -n F1  select-window -t :1
bind -n F2  select-window -t :2
bind -n F3  select-window -t :3
bind -n F4  select-window -t :4
bind -n F5  select-window -t :5
bind -n F6  select-window -t :6
bind -n F7  select-window -t :7
bind -n F8  select-window -t :8
bind -n F9  select-window -t :9
bind -n F10 select-window -t :10

bind -n F11 run "tmux has-session -t markit-agent 2>/dev/null || tmux new-session -ds markit-agent -c $HOME/Documents/projects/markit-agent; tmux switch-client -t markit-agent"
bind -n F12 run "tmux has-session -t markit-dt 2>/dev/null || tmux new-session -ds markit-dt -c $HOME/Documents/projects/markit-dt; tmux switch-client -t markit-dt"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
